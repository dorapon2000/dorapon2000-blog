# nginx.conf
events {}

http {
    types {
        text/html              html;
        application/javascript js;
        image/svg+xml          svg;
    }
    charset utf-8;
    log_format host '$scheme://$host$request_uri $status';

    # 80 番ポート: 攻撃者が HTTP の通信を書き換えた想定。どのパスにも「改ざんされた」中身を返す
    server {
        listen 80;
        server_name a.test b.test evil.test old.test;
        access_log /var/log/nginx/test.log host;
        root /usr/share/nginx/public/http;

        location = /favicon.ico { access_log off; return 204; }
        location / { try_files $uri /landing.html; }

        # HTTP のレスポンスに付けた HSTS は無視されるかの検証用
        location /hsts-over-http/ {
            add_header Strict-Transport-Security "max-age=31536000" always;
            try_files $uri /landing.html;
        }
    }

    # 443 番ポート: 本物のサイト。old.test は HTTPS で配信していない想定
    server {
        listen 443 ssl;
        server_name a.test b.test evil.test;
        access_log /var/log/nginx/test.log host;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        root /usr/share/nginx/public/https;

        location = /favicon.ico { access_log off; return 204; }

        location /none/ { alias /usr/share/nginx/public/https/case/; }
        location /csp/ {
            alias /usr/share/nginx/public/https/case/;
            add_header Content-Security-Policy "default-src https:";
        }
        location /uir/ {
            alias /usr/share/nginx/public/https/case/;
            add_header Content-Security-Policy "upgrade-insecure-requests";
        }
        location /both/ {
            alias /usr/share/nginx/public/https/case/;
            add_header Content-Security-Policy "upgrade-insecure-requests; default-src https:";
        }
        location /hsts/ {
            alias /usr/share/nginx/public/https/case/;
            add_header Strict-Transport-Security "max-age=31536000";
        }
    }

    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }
}
