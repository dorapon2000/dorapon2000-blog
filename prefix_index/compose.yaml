services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: bench
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./sql:/sql:ro
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 2s
      retries: 30

volumes:
  data:
